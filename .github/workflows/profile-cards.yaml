name: Update Profile Cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/profile-cards.yaml

jobs:
  profile-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=xy200303&show_icons=true&hide_border=true&show=reviews&hide_title=true&number_format=long&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=xy200303&layout=compact&hide=powershell&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update profile cards [skip ci]"
          git push
